  +'<rect x="30" y="70" width="20" height="20" rx="2" fill="'+(lit?'var(--glow)':'var(--glass)')+'" stroke="rgba(0,0,0,.25)"/><path d="M40 70v20M30 80h20" stroke="rgba(0,0,0,.25)"/>'
  +'<rect x="90" y="70" width="20" height="20" rx="2" fill="'+(lit?'var(--glow)':'var(--glass)')+'" stroke="rgba(0,0,0,.25)"/><path d="M100 70v20M90 80h20" stroke="rgba(0,0,0,.25)"/>'
  +'<rect x="150" y="84" width="5" height="36" fill="var(--post)"/>'
  +(count?'<g class="env"><rect x="141" y="56" width="24" height="15" rx="1.5" fill="#fffaf0" stroke="#d9534f" stroke-width="1.5"/><path d="M141 57l12 8 12-8" fill="none" stroke="#d9534f" stroke-width="1.5"/></g>':'')
  +'<rect x="136" y="66" width="34" height="20" rx="9" fill="var(--box)" stroke="rgba(0,0,0,.25)"/><rect x="140" y="74" width="14" height="3" rx="1.5" fill="rgba(0,0,0,.28)"/>'
  +'<g class="flag'+(up?'':' down')+'" data-up="'+(count?1:0)+'" style="transform-origin:168px 84px"><rect x="166" y="60" width="3" height="26" fill="var(--pole)"/><rect x="169" y="60" width="13" height="9" rx="1.5" fill="var(--flag)"/></g>'
  +'</svg>';
}

function renderTop(){
  $('#ttl').textContent=state.title||'Thank-You Town';
  $('#sub').textContent=state.sub||'';
  document.title=state.title||'Thank-You Town';
  var t='';
  if(owner)t+='<button class="btn" id="editbtn" type="button">'+(editMode?'Done editing':'Edit town')+'</button>';
  $('#tools').innerHTML=t;
}
function renderTown(){
  var q=query.trim().toLowerCase();
  var total=state.notes.length;
  $('#stats').textContent=state.residents.length+(state.residents.length===1?' house':' houses')+'  ·  '+total+(total===1?' thank-you':' thank-yous');
  var tl=teamsList();
  $('#teams').innerHTML=tl.map(function(x,i){return '<button class="chip" type="button" data-team="'+esc(x)+'" aria-pressed="'+(teamFilter===x)+'" style="--c:'+PALETTE[i%PALETTE.length]+'"><i></i>'+esc(x)+'</button>'}).join('');
  var anySample=state.residents.some(function(r){return r.s})||state.notes.some(function(n){return n.s});
  $('#notice').innerHTML=anySample?'<div class="notice">This is a sample town with example names and notes.'+(owner?' Open <b>Edit town</b> to move in your own colleagues, then use <b>Clear samples</b>.':' The real colleagues and notes will appear soon.')+'</div>':'';
  if(!state.residents.length){$('#town').innerHTML='<div class="empty"><b>No houses yet.</b><br>'+(owner?'Open Edit town and add your colleagues to start building the street.':'The street is being built. Please check back soon.')+'</div>';return}
  var list=state.residents.slice().sort(function(a,b){return a.name.localeCompare(b.name)});
  $('#town').innerHTML=list.map(function(r,i){
    var n=notesFor(r.id).length;
    var dim=(q&&r.name.toLowerCase().indexOf(q)<0)||(teamFilter&&(r.team||'').trim()!==teamFilter);
    var up=!firstRender||!n;
    return '<button class="house'+(dim?' dim':'')+'" type="button" data-id="'+esc(r.id)+'" aria-label="'+esc(r.name)+': '+(n?n+(n===1?' note':' notes'):'no notes yet')+'">'
      +'<div class="art">'+houseSVG(roofFor(r),n,up)+(n?'<span class="badge">'+n+'</span>':'')+'</div>'
      +'<div class="sign"><div class="nm">'+esc(r.name)+'</div><div class="sub">'+(r.team?esc(r.team)+'  ·  ':'')+(n?(n===1?'1 note':n+' notes'):'No mail yet')+'</div></div></button>';
  }).join('');
  if(firstRender){
    firstRender=false;
    var flags=document.querySelectorAll('.flag.down[data-up="1"]');
    requestAnimationFrame(function(){requestAnimationFrame(function(){flags.forEach(function(f,i){f.style.transitionDelay=(i*90)+'ms';f.classList.remove('down')})})});
  }
}
function renderAll(){renderTop();renderTown();if(!$('#scrim').hidden)renderModal();if(editMode)renderPanel();renderSave()}

function letterHTML(n,hl){
  var from=(n.from||'').trim();
  return '<article class="letter'+(hl?' hl':'')+'" data-nid="'+esc(n.id)+'"><p>'+esc(n.text)+'</p>'+(safeImg(n.img)?'<img alt="Photo of the handwritten note" src="'+n.img+'">':'')
   +'<div class="meta"><span>From '+(from?esc(from):'a friend')+'</span><span>'+esc(fmtDate(n.date))+'</span></div>'
   +(owner&&editMode?'<div class="ltools"><button class="btn small" type="button" data-edit="'+esc(n.id)+'">Edit</button><button class="btn small" type="button" data-del="'+esc(n.id)+'">Delete</button></div>':'')+'</article>';
}
var hlNote=null;
function renderModal(){
  var r=resident(openId);if(!r){closeModal();return}
  var ns=notesFor(openId);
  $('#modal').innerHTML='<div class="mh"><div><h2 id="mt">'+esc(r.name)+'\'s mailbox</h2><div class="sub">'+(r.team?esc(r.team)+'  ·  ':'')+(ns.length?ns.length+(ns.length===1?' note':' notes'):'Nothing yet')+'</div></div><button class="x" type="button" id="mx" aria-label="Close">&times;</button></div>'
   +'<div class="letters">'+(ns.length?ns.map(function(n){return letterHTML(n,n.id===hlNote)}).join(''):'<div class="noletters">The flag is down. No notes yet.'+(owner?' Add one from Edit town.':'')+'</div>')+'</div>';
}
function openMailbox(id,note){
  lastFocus=document.activeElement;openId=id;hlNote=note||null;
  $('#scrim').hidden=false;renderModal();
  var x=$('#mx');if(x)x.focus();
  if(note){var el=$('.letter.hl');if(el)el.scrollIntoView({block:'center'})}
}
function closeModal(){$('#scrim').hidden=true;openId=null;hlNote=null;if(lastFocus&&lastFocus.focus)lastFocus.focus()}

function opts(sel){return '<option value="">Choose a colleague</option>'+state.residents.slice().sort(function(a,b){return a.name.localeCompare(b.name)}).map(function(r){return '<option value="'+esc(r.id)+'"'+(r.id===sel?' selected':'')+'>'+esc(r.name)+(r.team?' ('+esc(r.team)+')':'')+'</option>'}).join('')}
function panelNote(){
  var list=state.notes.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});
  return '<p class="help">Add each thank-you here. The recipient\'s flag goes up and an envelope appears in their mailbox.</p>'
  +'<label>Thanking<select id="dTo">'+opts(draft.to)+'</select></label>'
  +'<label>From (leave empty to show &ldquo;a friend&rdquo;)<input type="text" id="dFrom" value="'+esc(draft.from)+'" autocomplete="off"></label>'
  +'<label>Message<textarea id="dText">'+esc(draft.text)+'</textarea></label>'
  +'<label>Date<input type="date" id="dDate" value="'+esc(draft.date)+'"></label>'
  +'<div><label>Photo of a handwritten note (optional)<input type="file" id="dImg" accept="image/*"></label>'+(draft.img?'<div class="thumb"><img alt="" src="'+draft.img+'"><button class="btn small" type="button" id="dImgX">Remove photo</button></div>':'')+'</div>'
  +'<p class="err" id="dErr">'+esc(draft.err)+'</p>'
  +'<div class="tools"><button class="btn pri" type="button" id="dAdd">'+(draft.id?'Update note':'Put in mailbox')+'</button>'+(draft.id?'<button class="btn" type="button" id="dCancel">Cancel edit</button>':'')+'</div>'
  +'<h3 style="font:800 1.1rem var(--display);margin:8px 0 0">All notes ('+list.length+')</h3>'
  +list.map(function(n){var r=resident(n.to);return '<div class="nrow"><span>'+esc(r?r.name:'?')+': '+esc(n.text)+'</span><div><button class="btn small" type="button" data-edit="'+esc(n.id)+'">Edit</button><button class="btn small" type="button" data-del="'+esc(n.id)+'">Delete</button></div></div>'}).join('');
}
function panelResidents(){
  return '<p class="help">Add several colleagues at once. Write one per line, as <b>Name, Team</b>. The team is optional and decides the roof colour.</p>'
  +'<label>New residents<textarea id="bulk" placeholder="Anita, Design&#10;Vikram, Tech"></textarea></label>'
  +'<div class="tools"><button class="btn pri" type="button" id="bulkAdd">Move them in</button></div>'
  +'<h3 style="font:800 1.1rem var(--display);margin:8px 0 0">Residents ('+state.residents.length+')</h3>'
  +state.residents.slice().sort(function(a,b){return a.name.localeCompare(b.name)}).map(function(r){var n=notesFor(r.id).length;return '<div class="rrow" data-rid="'+esc(r.id)+'"><input type="text" data-f="name" value="'+esc(r.name)+'" aria-label="Name"><input type="text" data-f="team" value="'+esc(r.team||'')+'" placeholder="Team" aria-label="Team"><button class="btn small" type="button" data-rm="'+esc(r.id)+'" data-n="'+n+'">Remove</button></div>'}).join('');
}
function panelTown(){
  var anySample=state.residents.some(function(r){return r.s})||state.notes.some(function(n){return n.s});
  return '<label>Town name<input type="text" id="tTitle" value="'+esc(state.title)+'"></label>'
  +'<label>Welcome line<textarea id="tSub">'+esc(state.sub)+'</textarea></label>'
  +(anySample?'<div class="notice">The example residents and notes are still here.</div><div class="tools"><button class="btn" type="button" id="clearSamples">Clear samples</button></div>':'<p class="help">No sample data left.</p>')
  +'<p class="help">Changes stay on this screen until you press <b>Save to town</b> at the bottom. After that every visitor sees them.</p>';
}
function renderPanel(){
  var p=$('#panel');p.hidden=!editMode;if(!editMode)return;
  var keepScroll=$('.pb',p)?$('.pb',p).scrollTop:0;
  p.innerHTML='<div class="ph"><h2>Edit town</h2><div class="tabs" role="tablist">'
   +[['note','Notes'],['res','Residents'],['town','Town']].map(function(t){return '<button class="tab" role="tab" type="button" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>'}).join('')+'</div></div>'
   +'<div class="pb">'+(tab==='note'?panelNote():tab==='res'?panelResidents():panelTown())+'</div>';
  $('.pb',p).scrollTop=keepScroll;
}
function renderSave(){$('#sav').hidden=!(owner&&dirty)}
function changed(){dirty=true;renderTown();renderSave();if(!$('#scrim').hidden)renderModal()}
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3200)}

function readImage(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,900/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function buildDoc(){
  var css=$('#app-css').textContent,js=$('#app-js').textContent;
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  var END='<'+'/script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+HEAD_HTML+'<style id="app-css">'+css+'</style><div id="app"></div><script type="application/json" id="town-data">'+json+END+'<script id="app-js">'+js+END+'</body></html>';
}
async function save(){
  if(saving)return;saving=true;$('#save').disabled=true;$('#save').textContent='Saving...';
  try{
    var art=await window.claude.use('artifact');
    if(!art)throw {code:'not_granted'};
    await art.publish(buildDoc());
  }catch(e){
    saving=false;$('#save').disabled=false;$('#save').textContent='Save to town';
    var c=e&&e.code;
    toast(c==='conflict'?'Someone saved first. The page is reloading with their version.':(c==='not_writer'||c==='not_granted')?'You can view this town but not change it.':c==='too_large'?'The town is too big. Remove some photos and try again.':c==='rate_limited'?'Saving too fast. Wait a moment and try again.':'Could not save. Check your connection and try again.');
  }
}

document.addEventListener('click',function(e){
  var t=e.target;if(!t.closest)return;
  var h=t.closest('.house');if(h){openMailbox(h.dataset.id);return}
  var chip=t.closest('[data-team]');if(chip){teamFilter=teamFilter===chip.dataset.team?'':chip.dataset.team;renderTown();return}
  if(t.id==='surprise'){if(!state.notes.length){toast('No notes in the town yet.');return}var n=state.notes[Math.floor(Math.random()*state.notes.length)];openMailbox(n.to,n.id);return}
  if(t.id==='scrim'||t.id==='mx'){closeModal();return}
  if(t.id==='editbtn'){editMode=!editMode;renderTop();renderPanel();return}
  if(t.id==='save'){save();return}
  if(t.id==='discard'){state=JSON.parse($('#town-data').textContent);dirty=false;draft=newDraft();renderAll();toast('Changes discarded.');return}
  var tb=t.closest('[data-tab]');if(tb&&tb.classList.contains('tab')){tab=tb.dataset.tab;renderPanel();return}
  var ed=t.closest('[data-edit]');if(ed){var n2=state.notes.filter(function(x){return x.id===ed.dataset.edit})[0];if(n2){draft={id:n2.id,to:n2.to,from:n2.from||'',text:n2.text,date:n2.date||today(),img:n2.img||'',err:''};tab='note';if(!$('#scrim').hidden)closeModal();renderPanel();var pb=$('.pb');if(pb)pb.scrollTop=0}return}
  var dl=t.closest('[data-del]');if(dl){if(dl.dataset.armed){state.notes=state.notes.filter(function(x){return x.id!==dl.dataset.del});if(draft.id===dl.dataset.del)draft=newDraft();changed();if(editMode)renderPanel()}else{dl.dataset.armed='1';dl.textContent='Tap again to delete'}return}
  var rm=t.closest('[data-rm]');if(rm){if(rm.dataset.armed){var id=rm.dataset.rm;state.residents=state.residents.filter(function(x){return x.id!==id});state.notes=state.notes.filter(function(x){return x.to!==id});changed();renderPanel()}else{rm.dataset.armed='1';rm.textContent=rm.dataset.n>0?'Delete house and '+rm.dataset.n+' notes?':'Tap again'}return}
  if(t.id==='dImgX'){draft.img='';renderPanel();return}
  if(t.id==='dCancel'){draft=newDraft();renderPanel();return}
  if(t.id==='dAdd'){
    if(!draft.to){draft.err='Choose who is being thanked.';renderPanel();return}
    if(!draft.text.trim()){draft.err='Write the thank-you message.';renderPanel();return}
    var obj={id:draft.id||uid('n'),to:draft.to,from:draft.from.trim(),text:draft.text.trim(),date:draft.date||today()};
    if(draft.img)obj.img=draft.img;
    if(draft.id){state.notes=state.notes.map(function(x){return x.id===draft.id?obj:x})}else{state.notes.push(obj)}
    var rr=resident(obj.to);draft=newDraft();changed();renderPanel();toast('Note placed in '+(rr?rr.name:'the')+'\'s mailbox.');return}
  if(t.id==='bulkAdd'){
    var lines=$('#bulk').value.split('\n').map(function(l){return l.trim()}).filter(Boolean);var added=0;
    lines.forEach(function(l){var p=l.split(',');var nm=p[0].trim();if(!nm)return;state.residents.push({id:uid('r'),name:nm,team:(p.slice(1).join(',')||'').trim()});added++});
    if(added){changed();renderPanel();toast(added+(added===1?' colleague moved in.':' colleagues moved in.'))}else toast('Type at least one name first.');return}
  if(t.id==='clearSamples'){state.residents=state.residents.filter(function(r){return !r.s});state.notes=state.notes.filter(function(n){return !n.s});state.sample=false;changed();renderPanel();toast('Sample data cleared.');return}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){query=t.value;renderTown();return}
  if(t.id==='dFrom')draft.from=t.value;else if(t.id==='dText')draft.text=t.value;else if(t.id==='dDate')draft.date=t.value;
  else if(t.id==='tTitle'){state.title=t.value;dirty=true;renderTop();renderSave()}
  else if(t.id==='tSub'){state.sub=t.value;dirty=true;renderTop();renderSave()}
  else if(t.dataset&&t.dataset.f){var row=t.closest('[data-rid]');var r=resident(row.dataset.rid);if(r){r[t.dataset.f]=t.value;if(t.dataset.f==='name'&&!t.value.trim())return;changed();}}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='dTo'){draft.to=t.value}
  else if(t.id==='dImg'&&t.files&&t.files[0]){readImage(t.files[0]).then(function(d){draft.img=d;renderPanel()}).catch(function(){draft.err='That photo could not be read. Try another one.';renderPanel()})}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#scrim').hidden)closeModal()});

renderAll();
(async function(){try{var u=window.claude&&window.claude.use?await window.claude.use('user'):null;if(u&&await u.isOwner()){owner=true;renderAll()}}catch(e){}})();
})();
</script>

</body></html>
